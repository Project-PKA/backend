# =============================================================================
# CodeQL — analise estatica de seguranca (SAST) do proprio codigo.
#
# Cobre o que o linter nao cobre: fluxo de dados entre arquivos (injecao de
# SQL/comando, SSRF, desserializacao insegura, dado externo chegando a um
# sink sem validacao).
#
# Configure a variable CODEQL_LANGUAGES (ex.: python, go, java-kotlin,
# javascript-typescript, csharp). Sem ela, o job FALHA com instrucao — de
# proposito: SAST desligado nao pode passar despercebido.
# Linguagem compilada com build proprio: CODEQL_BUILD_MODE=manual (usa
# `make build`).
#
# Logica em IgorOCosta/workflows (codeql.yml@v1). Alertas em Security -> Code scanning.
# =============================================================================
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Toda segunda as 03:17 UTC — pega CVE nova em codigo que ninguem tocou.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: IgorOCosta/workflows/.github/workflows/codeql.yml@v1
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: ${{ vars.CODEQL_LANGUAGES }}
      build-mode: ${{ vars.CODEQL_BUILD_MODE }}
