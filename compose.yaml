# Ambiente local.
#
#   docker compose up -d db                 # só o banco (funciona desde o dia 1)
#   docker compose --profile app up --build # banco + API (constrói ./Dockerfile; rode antes `npm run db:provision-dev`)

services:
  # TODO(bootstrap): troque a imagem se o banco escolhido em STACK.md não for
  # Postgres (ex.: mysql:8.4, mongo:8).
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Senha mesmo em desenvolvimento, para o código nunca depender de Redis aberto.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-app}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-app}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Caixa de e-mail de desenvolvimento: recebe tudo que a API envia por SMTP e mostra em
  # http://localhost:8025. Nada sai da sua máquina. Use EMAIL_PROVIDER=smtp, SMTP_HOST=localhost,
  # SMTP_PORT=1025 (veja .env.example).
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  app:
    profiles: [app]
    build: .
    init: true
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Dentro da rede do compose o banco é "db", não "localhost". A API usa o papel
      # app_api (sem BYPASSRLS), para o RLS valer. Crie-o antes: `npm run db:provision-dev`.
      DATABASE_URL: postgresql://${DB_APP_USER:-app_api}:${DB_APP_PASSWORD:-app_api}@db:5432/${DB_NAME:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD:-app}@redis:6379
      # Dentro do compose, o Mailpit é "mailpit" e as fotos ficam no volume `storage_data`.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: no-reply@pokemon-auction.local
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  db_data:
  redis_data:
  storage_data:
