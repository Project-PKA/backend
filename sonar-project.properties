# =============================================================================
# SonarCloud — ligado no CI (organização project-pka, projeto project-pka). Precisa do secret
# SONAR_TOKEN no GitHub.
# No SonarCloud, desligue "Automatic Analysis": ela conflita com o CI.
# =============================================================================
sonar.organization=project-pka
sonar.projectKey=project-pka
sonar.projectName=pokemonAuction Backend

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.exclusions=coverage/**,dist/**,build/**,target/**,docs/**,docker/**,migrations/**,**/generated/**

# Contrato com `make test-coverage`: o relatorio fica em coverage/.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
