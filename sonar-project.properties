# =============================================================================
# SonarCloud — DESLIGADO por enquanto (`sonar: false` em .github/workflows/ci.yml).
#
# Os valores abaixo seguem como placeholder de propósito até existir a conta no
# SonarCloud. Para reativar, siga shared/OWNER.md (A4) e preencha organization e
# projectKey (SETUP-GITHUB.md B5).
# No SonarCloud, desligue "Automatic Analysis": ela conflita com o CI.
# =============================================================================
sonar.organization=SUA-ORG
sonar.projectKey=SUA-ORG_SEU-REPOSITORIO
sonar.projectName=SEU-REPOSITORIO

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts
sonar.exclusions=coverage/**,dist/**,build/**,target/**,docs/**,docker/**,migrations/**,**/generated/**

# Contrato com `make test-coverage`: o relatorio fica em coverage/.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
