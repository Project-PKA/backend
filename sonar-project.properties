# =============================================================================
# SonarCloud — roda dentro do CI (job SonarCloud do ci-make, no ci-success).
#
# Ajuste organization/projectKey ao criar o projeto real (SETUP-GITHUB.md B5).
# No SonarCloud, desligue "Automatic Analysis": ela conflita com o CI.
# =============================================================================
sonar.organization=SUA-ORG
sonar.projectKey=SUA-ORG_SEU-REPOSITORIO
sonar.projectName=SEU-REPOSITORIO

# TODO(bootstrap): aponte para as pastas reais de codigo e de teste.
sonar.sources=.
sonar.exclusions=coverage/**,dist/**,build/**,target/**,docs/**,docker/**,migrations/**,**/generated/**

# Contrato com `make test-coverage`: o relatorio fica em coverage/.
# TODO(bootstrap): deixe so a linha da stack escolhida.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.python.coverage.reportPaths=coverage/coverage.xml
# sonar.go.coverage.reportPaths=coverage/coverage.out
# sonar.coverage.jacoco.xmlReportPaths=coverage/jacoco.xml
# sonar.cs.opencover.reportsPaths=coverage/coverage.opencover.xml

sonar.sourceEncoding=UTF-8
