    post:
      operationId: createCard
      summary: Cadastra uma carta no estoque (a origem é obrigatória)
      tags:
        - inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tcgdex_id
                - language
                - condition
                - origin
              additionalProperties: false
              properties:
                tcgdex_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                language:
                  type: string
                  pattern: ^[A-Z]{2}$
                condition:
                  type: string
                  enum:
                    - MINT
                    - NM
                    - SP
                    - MP
                    - HP
                    - DMG
                is_foil:
                  type: boolean
                notes:
                  type: string
                  maxLength: 2000
                  nullable: true
                origin:
                  type: string
                  enum:
                    - OWN
                    - CONSIGNED
                  description: "Sem valor padrão: quem cadastra escolhe"
                consignor_id:
                  type: string
                  format: uuid
                  nullable: true
                commission_pct:
                  type: number
                  minimum: 0
                  maximum: 100
                  nullable: true
                short_code:
                  type: string
                  pattern: ^[A-Za-z0-9]{1,12}$
                  description: Opcional. Sem ele a API gera A1, A2, ...
      parameters:
        - schema:
            type: string
          in: header
          name: x-store-id
          required: false
          description: Id da loja. Obrigatório nas rotas de uma loja; só vale se a pessoa
