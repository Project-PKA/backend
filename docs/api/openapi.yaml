openapi: 3.0.3
info:
  title: pokemonAuction API
  description: API do SaaS de leilões de cartas TCG via WhatsApp (nome provisório).
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      operationId: getHealth
      summary: "Liveness: o processo está de pé"
      tags:
        - infra
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /ready:
    get:
      operationId: getReady
      summary: "Readiness: as dependências (banco) respondem"
      tags:
        - infra
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Pede um código de login por e-mail
      tags:
        - auth
      description: Resposta sempre igual, exista ou não conta ativa para o e-mail. O
        acesso é somente por convite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Troca o código por uma sessão
      tags:
        - auth
      description: Devolve o access token e grava o refresh token em cookie httpOnly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - user
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    description: Segundos até o access token vencer
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Renova a sessão com o refresh token do cookie
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                  - user
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_in:
                    type: integer
                    description: Segundos até o access token vencer
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      tags:
        - auth
      responses:
        "204":
          description: Default Response
  /v1/auth/invitations/preview:
    post:
      operationId: previewInvitation
      summary: Mostra loja, papel e permissões de um convite, sem aceitá-lo
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - email
                  - store_name
                  - role
                  - permissions
                  - expires_at
                properties:
                  email:
                    type: string
                  store_name:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum:
                      - OWNER
                      - STAFF
                    nullable: true
                  permissions:
                    type: object
                    nullable: true
                    additionalProperties:
                      type: boolean
                  expires_at:
                    type: string
                    format: date-time
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Aceita o convite. Depois, o login é por código no e-mail
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - accepted
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/me:
    get:
      operationId: getMe
      summary: Perfil de quem está logado
      tags:
        - me
      security: &a1
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - name
                  - is_platform_admin
                  - can_create_stores
                  - store_limit
                  - phone
                  - birth_date
                  - cpf_masked
                  - address
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  name:
                    type: string
                    nullable: true
                  is_platform_admin:
                    type: boolean
                  can_create_stores:
                    type: boolean
                  store_limit:
                    type: integer
                  phone:
                    type: string
                    nullable: true
                    description: Só dígitos, com código do país
                  birth_date:
                    type: string
                    format: date
                    nullable: true
                  cpf_masked:
                    type: string
                    nullable: true
                    description: Só os dois últimos dígitos; o CPF inteiro nunca sai da API
                  address:
                    type: object
                    required:
                      - zip
                      - street
                      - number
                      - comp
                      - neighborhood
                      - city
                      - state
                    properties:
                      zip:
                        type: string
                        nullable: true
                      street:
                        type: string
                        nullable: true
                      number:
                        type: string
                        nullable: true
                      comp:
                        type: string
                        nullable: true
                      neighborhood:
                        type: string
                        nullable: true
                      city:
                        type: string
                        nullable: true
                      state:
                        type: string
                        nullable: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
    patch:
      operationId: updateMe
      summary: Edita os dados pessoais de quem está logado
      tags:
        - me
      description: Só os campos enviados mudam; `null` limpa. O CPF é validado e
        guardado cifrado (ADR 0019) e nunca volta inteiro. O e-mail e as
        permissões não mudam por aqui.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: \S
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                birth_date:
                  type: string
                  format: date
                  nullable: true
                cpf:
                  type: string
                  maxLength: 14
                  nullable: true
                  description: Validado; nunca devolvido inteiro
                address:
                  type: object
                  additionalProperties: false
                  description: "Mescla com o endereço atual: só os campos enviados mudam e `null`
                    limpa o campo."
                  properties:
                    zip:
                      type: string
                      maxLength: 9
                      nullable: true
                    street:
                      type: string
                      maxLength: 120
                      nullable: true
                    number:
                      type: string
                      maxLength: 20
                      nullable: true
                    comp:
                      type: string
                      maxLength: 60
                      nullable: true
                    neighborhood:
                      type: string
                      maxLength: 80
                      nullable: true
                    city:
                      type: string
                      maxLength: 80
                      nullable: true
                    state:
                      type: string
                      pattern: ^[A-Za-z]{2}$
                      nullable: true
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - name
                  - is_platform_admin
                  - can_create_stores
                  - store_limit
                  - phone
                  - birth_date
                  - cpf_masked
                  - address
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  name:
                    type: string
                    nullable: true
                  is_platform_admin:
                    type: boolean
                  can_create_stores:
                    type: boolean
                  store_limit:
                    type: integer
                  phone:
                    type: string
                    nullable: true
                    description: Só dígitos, com código do país
                  birth_date:
                    type: string
                    format: date
                    nullable: true
                  cpf_masked:
                    type: string
                    nullable: true
                    description: Só os dois últimos dígitos; o CPF inteiro nunca sai da API
                  address:
                    type: object
                    required:
                      - zip
                      - street
                      - number
                      - comp
                      - neighborhood
                      - city
                      - state
                    properties:
                      zip:
                        type: string
                        nullable: true
                      street:
                        type: string
                        nullable: true
                      number:
                        type: string
                        nullable: true
                      comp:
                        type: string
                        nullable: true
                      neighborhood:
                        type: string
                        nullable: true
                      city:
                        type: string
                        nullable: true
                      state:
                        type: string
                        nullable: true
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/me/stores:
    get:
      operationId: listMyStores
      summary: Lojas de que a pessoa participa (para escolher uma)
      tags:
        - me
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                        - role
                        - whatsapp_status
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        role:
                          type: string
                          enum:
                            - OWNER
                            - STAFF
                        whatsapp_status:
                          type: string
                          enum:
                            - ONLINE
                            - OFFLINE
                            - QR_READY
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: Sessões ativas da pessoa
      tags:
        - me
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - created_at
                        - user_agent
                        - ip
                        - current
                      properties:
                        id:
                          type: string
                          format: uuid
                        created_at:
                          type: string
                          format: date-time
                        user_agent:
                          type: string
                          nullable: true
                        ip:
                          type: string
                          nullable: true
                        current:
                          type: boolean
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
    delete:
      operationId: revokeAllMySessions
      summary: Encerra todas as sessões ("Sair de todos os aparelhos")
      tags:
        - me
      description: Por padrão encerra também a sessão atual (o cookie de renovação é
        apagado; o access token em uso vale só até expirar, no máximo 15
        minutos). Com `keep_current=true` a sessão deste aparelho continua
        (precisa do cookie de renovação para saber qual é).
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: keep_current
          required: false
      security: *a1
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/me/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Encerra uma das próprias sessões
      tags:
        - me
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security: *a1
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/stores:
    post:
      operationId: createStore
      summary: Cria uma loja (só com a permissão global e dentro do limite)
      tags:
        - store
      description: Exige `can_create_stores` e respeita `store_limit`, contado em
        lojas em que a pessoa é proprietária. Quem não tem a permissão pede ao
        administrador da plataforma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  pattern: \S
      security: &a2
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - whatsapp_status
                  - inactivity_days_limit
                  - role
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  whatsapp_status:
                    type: string
                    enum:
                      - ONLINE
                      - OFFLINE
                      - QR_READY
                  inactivity_days_limit:
                    type: integer
                    nullable: true
                  pix_key:
                    type: string
                    nullable: true
                    description: Chave PIX mostrada ao comprador
                  showcase_enabled:
                    type: boolean
                    description: Vitrine pública ligada (opt-in)
                  whatsapp_invite_url:
                    type: string
                    nullable: true
                    description: Link do grupo; fica público com a vitrine ligada
                  role:
                    type: string
                    enum:
                      - OWNER
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
  /v1/store:
    get:
      operationId: getCurrentStore
      summary: Loja do contexto (x-store-id) com o papel e as permissões de quem
        pergunta
      tags:
        - store
      parameters:
        - schema:
            type: string
          in: header
          name: x-store-id
          required: false
          description: Id da loja. Obrigatório nas rotas de uma loja; só vale se a pessoa
            participa dela
      security: *a2
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - whatsapp_status
                  - role
                  - permissions
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  whatsapp_status:
                    type: string
                    enum:
                      - ONLINE
                      - OFFLINE
                      - QR_READY
                  inactivity_days_limit:
                    type: integer
                    nullable: true
                  pix_key:
                    type: string
                    nullable: true
                    description: Chave PIX mostrada ao comprador
                  showcase_enabled:
                    type: boolean
                    description: Vitrine pública ligada (opt-in)
