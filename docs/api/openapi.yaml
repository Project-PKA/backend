openapi: 3.0.3
info:
  title: pokemonAuction API
  description: API do SaaS de leilões de cartas TCG via WhatsApp (nome provisório).
  version: 0.0.0
components:
  schemas: {}
paths:
  /health:
    get:
      operationId: getHealth
      summary: "Liveness: o processo está de pé"
      tags:
        - infra
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /ready:
    get:
      operationId: getReady
      summary: "Readiness: as dependências (banco) respondem"
      tags:
        - infra
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - title
                  - status
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
tags:
  - name: infra
    description: Health check, readiness e métricas
