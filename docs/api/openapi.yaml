  /v1/public/showcase:
    get:
      operationId: publicShowcase
      summary: Vitrine de leilões ao vivo das lojas que optaram por aparecer
      tags:
        - public
      description: Sem login. Só lojas com a vitrine ligada e o WhatsApp conectado.
        Página de no máximo 48 itens e deslocamento de no máximo 480. O link do
        grupo de WhatsApp de cada loja é público por escolha dela.
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: store
          required: false
        - schema:
            type: string
            pattern: ^[A-Z]{2}$
          in: query
          name: language
          required: false
        - schema:
            type: string
            enum:
              - ENDING_SOON
              - HIGHEST_BID
              - MOST_BIDS
              - NEWEST
          in: query
          name: sort
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
          in: query
          name: limit
          required: false
        - schema:
            type: integer
            minimum: 0
            maximum: 480
            default: 0
          in: query
          name: offset
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - stores
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: integer
                  stores:
