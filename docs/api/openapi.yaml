                - name
              additionalProperties: false
              properties:
                phone:
                  type: string
                  minLength: 8
                  maxLength: 20
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 254
                  nullable: true
                cpf:
                  type: string
                  maxLength: 14
                  nullable: true
                  description: Validado; nunca devolvido inteiro
